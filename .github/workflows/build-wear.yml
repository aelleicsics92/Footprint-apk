name: Build Wear OS (APK watch)

on:
  push:
    branches: [wear-os]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-wear
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Chiave di firma (la stessa dell'app telefono, serve per il Data Layer)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            cp android/footprint-dev.keystore "$KS"
            KS_PASS="footprint-dev"; KS_ALIAS="footprint"; KEY_PASS="footprint-dev"
          fi
          echo "FP_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "FP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "FP_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "FP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Compila APK watch
        working-directory: wear
        run: |
          set +e
          gradle assembleRelease -PfpVersionCode=${{ github.run_number }} --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          echo "GRADLE_CODE=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Pubblica APK e log sul ramo wear-build
        run: |
          rm -rf "$RUNNER_TEMP/pub"; mkdir -p "$RUNNER_TEMP/pub"
          grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Could not|Unresolved|not found" -A3 "$RUNNER_TEMP/gradle.log" | head -150 > "$RUNNER_TEMP/pub/errors.txt" || true
          tail -n 120 "$RUNNER_TEMP/gradle.log" > "$RUNNER_TEMP/pub/gradle-tail.txt" || true
          APK=wear/app/build/outputs/apk/release/app-release.apk
          if [ "$GRADLE_CODE" = "0" ] && [ -f "$APK" ]; then cp "$APK" "$RUNNER_TEMP/pub/footprint-wear.apk"; fi
          echo "exit=$GRADLE_CODE run=${{ github.run_number }} sha=${{ github.sha }}" > "$RUNNER_TEMP/pub/status.txt"
          cd "$RUNNER_TEMP/pub"
          git init -q
          git checkout -q -b wear-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "wear build ${{ github.run_number }} (exit $GRADLE_CODE)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" wear-build

      - name: Esito
        run: |
          if [ "$GRADLE_CODE" != "0" ]; then echo "::error::Gradle exit $GRADLE_CODE (vedi ramo wear-build)"; exit 1; fi
