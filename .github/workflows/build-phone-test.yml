name: Build telefono (prova dal ramo wear-os)

on:
  push:
    branches: [wear-os]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-phone-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web (le chiavi AI arrivano dai Secrets)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_TG_BOT: ${{ secrets.TG_BOT_USERNAME }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - run: npx cap sync android

      - name: Chiave di firma (la stessa dell'app watch)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            cp android/footprint-dev.keystore "$KS"
            KS_PASS="footprint-dev"; KS_ALIAS="footprint"; KEY_PASS="footprint-dev"
          fi
          echo "FP_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "FP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "FP_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "FP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease -PfpVersionCode=$((${{ github.run_number }} + 1000)) --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          echo "GRADLE_CODE=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Esito (log sul ramo phone-build, APK in una pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/pub"; mkdir -p "$RUNNER_TEMP/pub"
          grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Could not|Unresolved|not found" -A3 "$RUNNER_TEMP/gradle.log" | head -150 > "$RUNNER_TEMP/pub/errors.txt" || true
          tail -n 80 "$RUNNER_TEMP/gradle.log" > "$RUNNER_TEMP/pub/gradle-tail.txt" || true
          echo "exit=$GRADLE_CODE run=${{ github.run_number }} sha=${{ github.sha }}" > "$RUNNER_TEMP/pub/status.txt"
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ "$GRADLE_CODE" = "0" ] && [ -f "$APK" ]; then
            cp "$APK" "$RUNNER_TEMP/Footprint-telefono-wear-${{ github.run_number }}.apk"
            cp "$APK" "$RUNNER_TEMP/pub/footprint-telefono.apk"
            gh release create "phone-wear-${{ github.run_number }}" "$RUNNER_TEMP/Footprint-telefono-wear-${{ github.run_number }}.apk" \
              --target "${{ github.sha }}" --prerelease --latest=false \
              --title "Telefono + sync watch (prova ${{ github.run_number }})" \
              --notes "APK di prova dal ramo wear-os. Non sostituisce la build ufficiale."
          fi
          cd "$RUNNER_TEMP/pub"
          git init -q
          git checkout -q -b phone-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "phone build ${{ github.run_number }} (exit $GRADLE_CODE)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" phone-build
          if [ "$GRADLE_CODE" != "0" ]; then echo "::error::Gradle exit $GRADLE_CODE"; exit 1; fi
