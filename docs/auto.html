<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dove ho parcheggiato</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}#m{position:absolute;inset:0 0 70px 0}#b{position:absolute;left:0;right:0;bottom:0;height:70px;background:#12372a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;gap:10px}#b a{background:#fff;color:#12372a;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600;white-space:nowrap}#t{font-size:.9rem;line-height:1.3}</style></head>
<body><div id="m"></div><div id="b"><div id="t">Caricamento…</div><a id="g" href="#" target="_blank" rel="noopener" style="display:none">Indicazioni</a></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const q = new URLSearchParams(location.search), T = q.get('t'), U = q.get('u'), K = q.get('k');
const map = L.map('m').setView([42, 12.5], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
let mk, first = true;
async function load() {
  const t = document.getElementById('t');
  if (!T || !U || !K) { t.textContent = 'Link non valido'; return; }
  try {
    const r = await fetch(U + '/rest/v1/rpc/get_parking', { method: 'POST', headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' }, body: JSON.stringify({ t: T }) });
    const d = r.ok ? await r.json() : [];
    if (!d.length) { t.textContent = 'Posizione non disponibile (condivisione disattivata o revocata)'; return; }
    const p = d[0], ll = [p.lat, p.lon];
    if (!mk) mk = L.marker(ll).addTo(map); else mk.setLatLng(ll);
    if (first) { map.setView(ll, 16); first = false; }
    t.innerHTML = '<b>Auto di ' + (p.display_name || '') + '</b><br>Parcheggiata il ' + new Date(Number(p.ts)).toLocaleString('it-IT');
    const g = document.getElementById('g'); g.href = 'https://maps.google.com/?q=' + p.lat + ',' + p.lon; g.style.display = '';
  } catch (e) { t.textContent = 'Errore di rete'; }
}
load(); setInterval(load, 30000);
</script></body></html>
